[package]
name = "c2bf-core"
version = "0.2.0"
edition = "2021"

[workspace]
members = [".", "ffi", "wasm"]
# Plain `cargo build`/`cargo test` at this manifest keep meaning
# "the core only"; adapter crates build via their own manifests.
default-members = ["."]

[lib]
name = "c2bf_core"
path = "src/lib.rs"

[[bin]]
name = "tokdump"
path = "src/main.rs"

[[bin]]
name = "parsedump"
path = "src/bin/parsedump.rs"

[[bin]]
name = "bfcompile"
path = "src/bin/bfcompile.rs"

[[bin]]
name = "c2bf"
path = "src/bin/c2bf.rs"

[[bin]]
name = "c2bf-bench"
path = "src/bin/c2bf-bench.rs"
