[package]
name = "c2bf-wasm"
version = "0.1.0"
edition = "2021"
description = "WebAssembly adapter over c2bf-core (gated web distribution; kept out of the core crate)"
license = "MIT"

[lib]
name = "c2bf_wasm"
crate-type = ["cdylib", "rlib"]

[dependencies]
c2bf-core = { path = ".." }
wasm-bindgen = "0.2"

# wasm-opt is disabled: its bundled binaryen version used to vary
# with the unpinned wasm-pack release and once failed to parse the
# module wasm-bindgen 0.2.130 emits ("Only 1 table definition allowed
# in MVP"). The demo needs no binaryen optimization; the build stays
# byte-stable without it. CI additionally pins the wasm-pack version.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
