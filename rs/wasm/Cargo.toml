[package]
name = "c2bf-wasm"
version = "0.0.0"
edition = "2021"
description = "WebAssembly adapter over c2bf-core (gated web distribution; kept out of the core crate)"
license = "MIT"

[lib]
name = "c2bf_wasm"
crate-type = ["cdylib", "rlib"]

[dependencies]
c2bf-core = { path = ".." }
wasm-bindgen = "0.2"
