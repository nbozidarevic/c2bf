name: fuzz500-sweep

# TEMPORARY: 500-seed differential sweep validating the scanf EOF
# fix with the goto fuzzer extensions and EOF-terminated inputs.
# Removed once the numbers land.
on:
  push:
    paths:
      - .github/workflows/fuzz500-sweep.yml

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --manifest-path rs/Cargo.toml

      - name: Fuzz 500 seeds
        working-directory: tests
        run: python3 fuzz.py --count 500 --seed-base 0 --continue-on-failure
