name: shadow-probe

# TEMPORARY: probe GNU g++/gcc behavior for declarations that share a
# parameter's name, to decide whether c2bf must reject them. Probe
# only: always exits 0, prints evidence. Removed once read.
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe parameter shadowing
        run: |
          set +e
          g++ --version | head -1
          gcc --version | head -1
          mkdir -p /tmp/shadow
          cat > /tmp/shadow/p1_top_init.c <<'EOF'
          #include <stdio.h>
          int f(int x) { int x = 5; return x; }
          int main() { printf("%d\n", f(9)); return 0; }
          EOF
          cat > /tmp/shadow/p2_nested.c <<'EOF'
          #include <stdio.h>
          int f(int x) { { int x = 5; return x; } return x; }
          int main() { printf("%d\n", f(9)); return 0; }
          EOF
          cat > /tmp/shadow/p3_top_noint.c <<'EOF'
          #include <stdio.h>
          int f(int x) { int x; return x; }
          int main() { printf("%d\n", f(9)); return 0; }
          EOF
          cat > /tmp/shadow/p4_forinit.c <<'EOF'
          #include <stdio.h>
          int f(int x) { for (int x = 0; x < 1; x++) {} return x; }
          int main() { printf("%d\n", f(9)); return 0; }
          EOF
          cat > /tmp/shadow/p5_multi.c <<'EOF'
          #include <stdio.h>
          int f(int x) { int x = 5, y = 1; return x + y; }
          int main() { printf("%d\n", f(9)); return 0; }
          EOF
          cat > /tmp/shadow/p6_use_before.c <<'EOF'
          #include <stdio.h>
          int f(int x) { int y = x; int x = 2; return y; }
          int main() { printf("%d\n", f(9)); return 0; }
          EOF
          cat > /tmp/shadow/p7_global.c <<'EOF'
          #include <stdio.h>
          int x = 7;
          int f() { int x = 5; return x; }
          int main() { printf("%d\n", f()); return 0; }
          EOF
          cat > /tmp/shadow/p8_same_scope.c <<'EOF'
          #include <stdio.h>
          int f() { int x = 1; int x = 2; return x; }
          int main() { printf("%d\n", f()); return 0; }
          EOF
          cat > /tmp/shadow/p9_array.c <<'EOF'
          #include <stdio.h>
          int f(int x) { char x[2]; return x[0]; }
          int main() { printf("%d\n", f(9)); return 0; }
          EOF
          for p in p1_top_init p2_nested p3_top_noint p4_forinit p5_multi p6_use_before p7_global p8_same_scope p9_array; do
            for cc in "g++ -w" "gcc -std=c11 -w"; do
              echo "=== $p with $cc ==="
              $cc /tmp/shadow/$p.c -o /tmp/shadow/$p.bin > /tmp/shadow/$p.log 2>&1
              echo "compile exit=$?"
              cat /tmp/shadow/$p.log
              if [ -x /tmp/shadow/$p.bin ]; then
                echo "--- run ---"
                /tmp/shadow/$p.bin
                echo "run exit=$?"
                rm -f /tmp/shadow/$p.bin
              fi
            done
          done
