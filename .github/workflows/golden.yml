name: pointers-goldens

# TEMPORARY: emit tokdump/parsedump/bf goldens for the new pointers
# fixture and the order_index/order_deref probes from the CI-built
# binaries. Removed once the goldens land.
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --manifest-path rs/Cargo.toml

      - name: Emit goldens
        run: |
          mkdir -p goldens-out
          ./rs/target/release/tokdump tests/compile/pointers.c > goldens-out/pointers.tok
          ./rs/target/release/parsedump tests/compile/pointers.c > goldens-out/pointers.parse
          ./rs/target/release/bfcompile tests/compile/pointers.c > goldens-out/pointers.bf
          ./rs/target/release/bfcompile tests/differential/micro/order_index.c > goldens-out/micro_order_index.bf
          ./rs/target/release/bfcompile tests/differential/micro/order_deref.c > goldens-out/micro_order_deref.bf

      - name: Upload goldens
        uses: actions/upload-artifact@v4
        with:
          name: pointers-goldens
          path: goldens-out
          if-no-files-found: error
