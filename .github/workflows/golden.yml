name: golden-snapshot

# TEMPORARY (memory tracking): refresh the perf doc with the new
# bench columns (cells alloc/touched/peak). Removed once landed;
# regenerate via tests/golden/generate.sh afterwards.
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --manifest-path rs/Cargo.toml

      - name: Generate goldens
        run: ./tests/golden/generate.sh

      - name: Refresh perf doc
        run: ./rs/target/release/c2bf-bench --write docs/perf.md

      - name: Upload goldens
        uses: actions/upload-artifact@v4
        with:
          name: goldens
          path: tests/golden
          if-no-files-found: error

      - name: Upload perf doc
        uses: actions/upload-artifact@v4
        with:
          name: perfmd
          path: docs/perf.md
          if-no-files-found: error
