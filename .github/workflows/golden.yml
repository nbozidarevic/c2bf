name: div-scanf-goldens

# TEMPORARY: emit goldens for the fixtures whose emission changed
# under the division guard and scanf sign (CI-built binaries).
# Removed once the goldens land.
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --manifest-path rs/Cargo.toml

      - name: Emit changed goldens
        run: |
          mkdir -p goldens-out
          for n in assign complex continue div io mod pointers typespec; do
            ./rs/target/release/bfcompile tests/compile/$n.c > goldens-out/$n.bf
          done
          ./rs/target/release/tokdump tests/compile/io.c > goldens-out/io.tok
          ./rs/target/release/parsedump tests/compile/io.c > goldens-out/io.parse

      - name: Upload goldens
        uses: actions/upload-artifact@v4
        with:
          name: div-scanf-goldens
          path: goldens-out
          if-no-files-found: error
