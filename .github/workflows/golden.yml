name: arrays-goldens

# TEMPORARY: emit tokdump/parsedump/bf goldens for the new arrays
# fixture from the CI-built binaries. Removed once the goldens land.
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --manifest-path rs/Cargo.toml

      - name: Emit arrays goldens
        run: |
          mkdir -p goldens-out
          ./rs/target/release/tokdump tests/compile/arrays.c > goldens-out/arrays.tok
          ./rs/target/release/parsedump tests/compile/arrays.c > goldens-out/arrays.parse
          ./rs/target/release/bfcompile tests/compile/arrays.c > goldens-out/arrays.bf

      - name: Upload goldens
        uses: actions/upload-artifact@v4
        with:
          name: arrays-goldens
          path: goldens-out
          if-no-files-found: error
