name: strings-goldens

# TEMPORARY: emit the strings golden from the CI-built binary after
# the single-dispatch %s change. Removed once the golden lands.
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --manifest-path rs/Cargo.toml

      - name: Emit strings golden
        run: |
          mkdir -p goldens-out
          ./rs/target/release/bfcompile tests/compile/strings.c > goldens-out/strings.bf

      - name: Upload golden
        uses: actions/upload-artifact@v4
        with:
          name: strings-golden
          path: goldens-out
          if-no-files-found: error
