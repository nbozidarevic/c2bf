name: seed3-probe
on:
  push:
    paths:
      - .github/workflows/seed3-probe.yml
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --manifest-path rs/Cargo.toml
      - name: Bisect seed 3 cell growth
        run: |
          python3 - <<'EOF'
          import subprocess, sys
          sys.path.insert(0, "tests")
          import fuzz
          src, _ = fuzz.gen_program(3)
          lines = src.splitlines()
          def variant(upto):
              return "\n".join(lines[:upto] + ["}"]) + "\n"
          variants = {
              "pA-through-v4++": variant(23),
              "pB-through-first-printf": variant(24),
              "pC-through-dowhile-if": variant(35),
              "pD-through-switch": variant(78),
              "pE-full-no-final-string": src.replace(
                  'printf("%hX, %c, %s\\n", (v3), \'z\', "z");',
                  'printf("%hX, %c, %c\\n", (v3), \'z\', \'z\');'),
              "pF-full": src,
          }
          for name, text in variants.items():
              p = f"/tmp/{name}.c"
              open(p, "w").write(text)
              r = subprocess.run(
                  ["./rs/target/release/c2bf", "compile", "-c", p,
                   "--stats", "-o", "/dev/null"],
                  stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)
              first = (r.stderr.strip().splitlines() or ["<no stderr>"])[0]
              print(f"{name}: exit={r.returncode} :: {first}", flush=True)
          EOF
