name: seed3-probe
on:
  push:
    paths:
      - .github/workflows/seed3-probe.yml
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --manifest-path rs/Cargo.toml
      - name: Isolate percent-i trigger
        run: |
          python3 - <<'EOF'
          import subprocess, sys
          sys.path.insert(0, "tests")
          import fuzz
          src, _ = fuzz.gen_program(3)
          lines = src.splitlines()
          variants = {
              "q1-switch-with-pct-d": (
                  "\n".join(lines[:78] + ["}"]) + "\n"
              ).replace('scanf("%i %d"', 'scanf("%d %d"'),
              "q2-late-string-after-scanf": (
                  "\n".join(lines[:23])
                  + '\n  char *p = "late";\n  printf("%s", p);\n}\n'
              ),
              "q3-no-switch-final-printf": (
                  "\n".join(lines[:35] + [lines[78]] + ["}"]) + "\n"
              ),
              "q4-full-with-pct-d": src.replace(
                  'scanf("%i %d"', 'scanf("%d %d"'),
          }
          for name, text in variants.items():
              p = f"/tmp/{name}.c"
              open(p, "w").write(text)
              r = subprocess.run(
                  ["./rs/target/release/c2bf", "compile", "-c", p,
                   "--stats", "-o", "/dev/null"],
                  stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)
              first = (r.stderr.strip().splitlines() or ["<no stderr>"])[0]
              print(f"{name}: exit={r.returncode} :: {first}", flush=True)
          EOF
