name: spike-measure
on:
  push:
    branches: [spike/switch-lazy]
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --manifest-path rs/Cargo.toml
      - name: Unit tests
        run: cargo test --manifest-path rs/Cargo.toml
      - name: Differential suite
        working-directory: tests
        run: python3 test
      - name: Micro counts and fixture stats
        run: |
          python3 - <<'EOF'
          import glob, os, re, subprocess, sys
          B = "./rs/target/release/c2bf"
          def stats(src, name):
              open("/tmp/m.c", "w").write(src)
              r = subprocess.run([B, "compile", "-c", "/tmp/m.c", "--stats",
                                  "-o", "/tmp/m.bf"],
                                 stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                                 text=True)
              m = re.search(r"BF bytes: (\d+), cells: (\d+)", r.stderr)
              print(f"{name}: exit={r.returncode} "
                    f"bytes={m.group(1) if m else '?'} "
                    f"cells={m.group(2) if m else '?'} "
                    f"err={r.stderr.strip().splitlines()[0] if r.returncode else ''}",
                    flush=True)
          H = "#include <stdio.h>\n"
          stats(H + 'int main() { int s7 = 0; scanf("%i", &s7); }', "scanf_i")
          sys.path.insert(0, "tests")
          import fuzz
          for seed in (3, 5):
              src, _ = fuzz.gen_program(seed)
              stats(src, f"fuzz-seed-{seed}")
          for f in sorted(glob.glob("tests/compile/*.c")):
              r = subprocess.run([B, "compile", "-c", f, "--stats", "-o", "/tmp/m.bf"],
                                 stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                                 text=True)
              m = re.search(r"BF bytes: (\d+), cells: (\d+)", r.stderr)
              print(f"fixture {os.path.basename(f)}: exit={r.returncode} "
                    f"bytes={m.group(1) if m else '?'} "
                    f"cells={m.group(2) if m else '?'}", flush=True)
          EOF
      - name: Fuzz 50 seeds (includes seed 5)
        working-directory: tests
        run: python3 fuzz.py --count 50
      - name: Perf harness
        run: ./rs/target/release/c2bf-bench
