name: pages-demo

# Demo deployment (Phase 7b, gated). The owner enables GitHub Pages
# (Settings -> Pages -> Source: GitHub Actions); this workflow then
# runs automatically on pushes touching the demo, the Rust sources
# (the WASM build embeds c2bf-core), or itself, and also on manual
# dispatch. The build steps mirror the verified `wasm` CI job.
# wasm-pack resolves a relative --out-dir against the crate
# directory, so the out-dir below must be absolute or the bundle lands
# in rs/wasm/demo/pkg and the deployed page 404s on it.
on:
  push:
    branches: [master]
    paths:
      - "demo/**"
      - "rs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # Pinned, same as ci.yml: the action resolves "latest"
      # nondeterministically across runs.
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "v0.15.1"

      - name: Build demo bundle
        run: wasm-pack build rs/wasm --target web --out-dir "$GITHUB_WORKSPACE/demo/pkg"

      - name: Check demo bundle landed where the page expects it
        run: test -f demo/pkg/c2bf_wasm.js && test -f demo/pkg/c2bf_wasm_bg.wasm

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: demo/

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
