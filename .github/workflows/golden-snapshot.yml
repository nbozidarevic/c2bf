# Temporary golden snapshot for the enums fixture only.
# Never merged as a standing workflow; removed after the
# snapshot is committed.
name: golden-snapshot

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --manifest-path rs/Cargo.toml

      - name: Generate enums goldens
        working-directory: tests
        run: |
          ../rs/target/release/tokdump compile/enums.c > /tmp/enums.tok
          ../rs/target/release/parsedump compile/enums.c > /tmp/enums.parse
          ../rs/target/release/bfcompile compile/enums.c > /tmp/enums.bf
          wc -c /tmp/enums.tok /tmp/enums.parse /tmp/enums.bf

      - name: Upload enums goldens
        uses: actions/upload-artifact@v4
        with:
          name: enums-goldens
          path: |
            /tmp/enums.tok
            /tmp/enums.parse
            /tmp/enums.bf
