# Temporary golden snapshot for the pointerret fixture only.
# Never merged as a standing workflow; removed after the
# snapshot is committed.
name: golden-snapshot

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --manifest-path rs/Cargo.toml

      - name: Generate pointerret goldens
        working-directory: tests
        run: |
          ../rs/target/release/tokdump compile/pointerret.c > /tmp/pointerret.tok
          ../rs/target/release/parsedump compile/pointerret.c > /tmp/pointerret.parse
          ../rs/target/release/bfcompile compile/pointerret.c > /tmp/pointerret.bf
          wc -c /tmp/pointerret.tok /tmp/pointerret.parse /tmp/pointerret.bf

      - name: Upload pointerret goldens
        uses: actions/upload-artifact@v4
        with:
          name: pointerret-goldens
          path: |
            /tmp/pointerret.tok
            /tmp/pointerret.parse
            /tmp/pointerret.bf
