# Temporary golden re-snapshot after the scanf EOF fix:
# number-reader emission changed, so every fixture is
# re-emitted and only changed blobs land. Removed after the
# snapshot is committed.
name: golden-snapshot

on:
  push:
    paths:
      - .github/workflows/golden-snapshot.yml

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --manifest-path rs/Cargo.toml
      - name: Re-emit all goldens
        working-directory: tests
        run: |
          mkdir -p /tmp/goldens/tokdump /tmp/goldens/parsedump /tmp/goldens/bf
          for f in compile/*.c; do
            n=$(basename "$f" .c)
            ../rs/target/release/tokdump "$f" > "/tmp/goldens/tokdump/$n.tok"
            ../rs/target/release/parsedump "$f" > "/tmp/goldens/parsedump/$n.parse"
            ../rs/target/release/bfcompile "$f" > "/tmp/goldens/bf/$n.bf"
          done
          for f in differential/micro/*.c; do
            n=$(basename "$f" .c)
            ../rs/target/release/bfcompile "$f" > "/tmp/goldens/bf/micro_$n.bf"
          done
      - name: Upload goldens
        uses: actions/upload-artifact@v4
        with:
          name: all-goldens
          path: /tmp/goldens
