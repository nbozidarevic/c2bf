# Temporary golden snapshot for the goto fixtures.
# Never merged as a standing workflow; removed after the
# snapshot is committed.
name: golden-snapshot

on:
  push:
    paths:
      - .github/workflows/golden-snapshot.yml

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --manifest-path rs/Cargo.toml
      - name: Generate changed goldens
        working-directory: tests
        run: |
          mkdir -p /tmp/goldens
          for n in goto_fwd goto_fwd_struct goto_cleanup goto_cleanup_struct goto_loop goto_loop_struct goto_for goto_for_struct goto_dowhile goto_dowhile_struct; do
            ../rs/target/release/tokdump "compile/$n.c" > "/tmp/goldens/$n.tok"
            ../rs/target/release/parsedump "compile/$n.c" > "/tmp/goldens/$n.parse"
            ../rs/target/release/bfcompile "compile/$n.c" > "/tmp/goldens/$n.bf"
            wc -c "/tmp/goldens/$n.tok" "/tmp/goldens/$n.parse" "/tmp/goldens/$n.bf"
          done
      - name: Upload changed goldens
        uses: actions/upload-artifact@v4
        with:
          name: changed-goldens
          path: /tmp/goldens
