# Temporary golden snapshot for the formats fixture only.
# Never merged as a standing workflow; removed after the
# snapshot is committed.
name: golden-snapshot

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --manifest-path rs/Cargo.toml

      - name: Generate formats goldens
        working-directory: tests
        run: |
          ../rs/target/release/tokdump compile/formats.c > /tmp/formats.tok
          ../rs/target/release/parsedump compile/formats.c > /tmp/formats.parse
          ../rs/target/release/bfcompile compile/formats.c > /tmp/formats.bf
          wc -c /tmp/formats.tok /tmp/formats.parse /tmp/formats.bf

      - name: Upload formats goldens
        uses: actions/upload-artifact@v4
        with:
          name: formats-goldens
          path: |
            /tmp/formats.tok
            /tmp/formats.parse
            /tmp/formats.bf
