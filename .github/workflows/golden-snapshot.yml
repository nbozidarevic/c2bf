# Temporary golden snapshot for the enums and storage fixtures only.
# Never merged as a standing workflow; removed after the
# snapshot is committed.
name: golden-snapshot

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --manifest-path rs/Cargo.toml

      - name: Generate fixture goldens
        working-directory: tests
        run: |
          for n in enums storage; do
            ../rs/target/release/tokdump compile/$n.c > /tmp/$n.tok
            ../rs/target/release/parsedump compile/$n.c > /tmp/$n.parse
            ../rs/target/release/bfcompile compile/$n.c > /tmp/$n.bf
          done
          wc -c /tmp/enums.tok /tmp/enums.parse /tmp/enums.bf /tmp/storage.tok /tmp/storage.parse /tmp/storage.bf

      - name: Upload fixture goldens
        uses: actions/upload-artifact@v4
        with:
          name: fixture-goldens
          path: |
            /tmp/enums.tok
            /tmp/enums.parse
            /tmp/enums.bf
            /tmp/storage.tok
            /tmp/storage.parse
            /tmp/storage.bf
