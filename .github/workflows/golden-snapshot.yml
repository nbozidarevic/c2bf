# Temporary golden snapshot for the braceinit fixture only.
# Never merged as a standing workflow; removed after the
# snapshot is committed.
name: golden-snapshot

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --manifest-path rs/Cargo.toml

      - name: Generate braceinit goldens
        working-directory: tests
        run: |
          ../rs/target/release/tokdump compile/braceinit.c > /tmp/braceinit.tok
          ../rs/target/release/parsedump compile/braceinit.c > /tmp/braceinit.parse
          ../rs/target/release/bfcompile compile/braceinit.c > /tmp/braceinit.bf
          wc -c /tmp/braceinit.tok /tmp/braceinit.parse /tmp/braceinit.bf

      - name: Upload braceinit goldens
        uses: actions/upload-artifact@v4
        with:
          name: braceinit-goldens
          path: |
            /tmp/braceinit.tok
            /tmp/braceinit.parse
            /tmp/braceinit.bf
