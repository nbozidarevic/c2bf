name: golden-snapshot

# TEMPORARY: regenerate goldens with prototypes.
# Removed once the snapshot lands.
on:
  push:
    branches: [master]

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --manifest-path rs/Cargo.toml

      - name: Regenerate goldens
        run: ./tests/golden/generate.sh

      - name: Upload goldens
        uses: actions/upload-artifact@v4
        with:
          name: prototype-goldens
          path: tests/golden
          if-no-files-found: error
