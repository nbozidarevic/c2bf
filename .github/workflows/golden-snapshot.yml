# Temporary golden snapshot for the typedefs fixture only.
# Never merged as a standing workflow; removed after the
# snapshot is committed.
name: golden-snapshot

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --manifest-path rs/Cargo.toml

      - name: Generate typedefs goldens
        working-directory: tests
        run: |
          ../rs/target/release/tokdump compile/typedefs.c > /tmp/typedefs.tok
          ../rs/target/release/parsedump compile/typedefs.c > /tmp/typedefs.parse
          ../rs/target/release/bfcompile compile/typedefs.c > /tmp/typedefs.bf
          wc -c /tmp/typedefs.tok /tmp/typedefs.parse /tmp/typedefs.bf

      - name: Upload typedefs goldens
        uses: actions/upload-artifact@v4
        with:
          name: typedefs-goldens
          path: |
            /tmp/typedefs.tok
            /tmp/typedefs.parse
            /tmp/typedefs.bf
