name: pointers-debug

# TEMPORARY: show the transpiled vs g++ outputs for pointers.c.
# Removed once the oracle difference is understood.
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --manifest-path rs/Cargo.toml

      - name: Compare outputs
        run: |
          mkdir -p debug-out
          ./rs/target/release/bfcompile tests/compile/pointers.c > debug-out/pointers.bf
          ./rs/target/release/c2bf run -c debug-out/pointers.bf -i tests/compile/pointers.in > debug-out/rs.txt; echo "rs exit: $?" >> debug-out/rs.txt
          g++ -w tests/compile/pointers.c -o /tmp/pointers.o
          /tmp/pointers.o < tests/compile/pointers.in > debug-out/gcc.txt; echo "gcc exit: $?" >> debug-out/gcc.txt
          diff -u debug-out/gcc.txt debug-out/rs.txt > debug-out/diff.txt || true
          cat debug-out/diff.txt

      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: pointers-debug
          path: debug-out
          if-no-files-found: error
