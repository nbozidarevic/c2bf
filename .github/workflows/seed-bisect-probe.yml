name: seed-bisect-probe
on:
  push:
    paths:
      - .github/workflows/seed-bisect-probe.yml
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --manifest-path rs/Cargo.toml
      - name: Bisect failing seed prefixes
        run: |
          python3 - <<'EOF'
          import subprocess, sys
          sys.path.insert(0, "tests")
          import fuzz
          seed = int("6")
          src, _ = fuzz.gen_program(seed)
          lines = src.splitlines()
          depth = 0
          cuts = []
          for i, ln in enumerate(lines):
              d0 = depth
              depth += ln.count("{") - ln.count("}")
              if d0 == 1 and depth == 1 and i > 2:
                  cuts.append(i)
          print(f"seed {seed}: {len(lines)} lines, cuts at {cuts}", flush=True)
          for upto in cuts:
              text = "\n".join(lines[:upto + 1] + ["}"]) + "\n"
              open("/tmp/p.c", "w").write(text)
              r = subprocess.run(
                  ["./rs/target/release/c2bf", "compile", "-c", "/tmp/p.c",
                   "--stats", "-o", "/tmp/p.bf"],
                  stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)
              first = (r.stderr.strip().splitlines() or ["<no stderr>"])[0]
              last = lines[upto].strip()[:60]
              print(f"cut@{upto + 1} [{last}]: exit={r.returncode} :: {first}",
                    flush=True)
              if r.returncode != 0:
                  break
          EOF
